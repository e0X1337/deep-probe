name: Cat Probe
on: push
jobs:
  escape:
    runs-on: ubuntu-latest
    steps:
      - name: Docker test
        run: |
          echo "KERNEL: $(uname -r)"
          echo "DOCKER_SOCK: $(ls -la /var/run/docker.sock 2>&1)"
          echo "ID: $(id)"
          docker info 2>&1 | grep -E "Server Version|Storage Driver|Security Options" || echo "docker info failed"
          echo "---PRIVILEGED---"
          docker run --rm --privileged alpine cat /proc/sys/kernel/hostname 2>&1
          echo "---HOSTFS---"
          docker run --rm -v /:/hostroot:ro alpine ls /hostroot/home/ 2>&1
          echo "---HOSTPID---"
          docker run --rm --pid=host alpine ps aux 2>&1 | grep -v "ps aux" | head -15
          echo "---HOSTIPC---"
          docker run --rm --ipc=host alpine ls /dev/shm/ 2>&1
          echo "---NETWORK---"
          hostname -I
          ip route 2>/dev/null | head -3
          echo "---MERGE_QUEUE---"
          echo "done"
